<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}停車場管理{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
      <i class="bi bi-p-square-fill me-1"></i>停車場管理
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}"
             href="{{ url_for('dashboard') }}"><i class="bi bi-grid-3x3-gap me-1"></i>儀表板</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['spots','spot_edit'] %}active{% endif %}"
             href="{{ url_for('spots') }}"><i class="bi bi-pin-map me-1"></i>車位管理</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['tenants','tenant_edit'] %}active{% endif %}"
             href="{{ url_for('tenants') }}"><i class="bi bi-person-lines-fill me-1"></i>車主管理</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['rentals'] %}active{% endif %}"
             href="{{ url_for('rentals') }}"><i class="bi bi-file-earmark-text me-1"></i>出租管理</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['payments'] %}active{% endif %}"
             href="{{ url_for('payments') }}"><i class="bi bi-cash-coin me-1"></i>繳費管理</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['expenses','expense_edit'] %}active{% endif %}"
             href="{{ url_for('expenses') }}"><i class="bi bi-tools me-1"></i>支出/退費管理</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['reports'] %}active{% endif %}"
             href="{{ url_for('reports') }}"><i class="bi bi-bar-chart-line me-1"></i>報表</a>
        </li>
        <li class="nav-item ms-lg-3">
          <a class="nav-link {% if request.endpoint in ['schedule'] %}active{% endif %}"
             href="{{ url_for('schedule') }}"><i class="bi bi-clock-history me-1"></i>排程</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['settings'] %}active{% endif %}"
             href="{{ url_for('settings') }}"><i class="bi bi-shield-check me-1"></i>備份還原</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid py-3 px-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
