{% extends "base.html" %}
{% block title %}編輯支出記錄{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header fw-semibold bg-danger text-white">
        <i class="bi bi-pencil-square me-2"></i>編輯支出記錄
      </div>
      <div class="card-body">
        <form action="{{ url_for('expense_edit', expense_id=exp.id) }}" method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">日期</label>
            <input type="date" name="expense_date" class="form-control"
                   value="{{ exp.expense_date.strftime('%Y-%m-%d') }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">類別</label>
            <select name="category" class="form-select">
              {% for cat in categories %}
              <option value="{{ cat }}" {% if exp.category == cat %}selected{% endif %}>{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">金額（元）</label>
            <input type="number" name="amount" class="form-control"
                   value="{{ exp.amount | int }}" min="1" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">說明</label>
            <textarea name="description" class="form-control" rows="2">{{ exp.description or '' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">儲存</button>
            <a href="{{ url_for('expenses') }}" class="btn btn-secondary">取消</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
