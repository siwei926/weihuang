{% extends "base.html" %}
{% block title %}編輯車位 {{ spot.spot_number }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header fw-semibold">
        <i class="bi bi-pencil-square me-2"></i>編輯車位 {{ spot.spot_number }}
      </div>
      <div class="card-body">
        <form action="{{ url_for('spot_edit', spot_id=spot.id) }}" method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">車位編號 <span class="text-danger">*</span></label>
            <input type="text" name="spot_number" class="form-control"
                   value="{{ spot.spot_number }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">備註</label>
            <input type="text" name="notes" class="form-control"
                   value="{{ spot.notes or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">車位類型</label>
            <select name="spot_type" class="form-select">
              <option value="rental"   {% if spot.spot_type == 'rental'   %}selected{% endif %}>出租（可收租）</option>
              <option value="disabled" {% if spot.spot_type == 'disabled' %}selected{% endif %}>停用</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">儲存</button>
            <a href="{{ url_for('spots') }}" class="btn btn-secondary">取消</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
